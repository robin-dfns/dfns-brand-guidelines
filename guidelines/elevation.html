<!-- @dsCard group="Effects" viewport="700x170" name="Elevation" subtitle="Six named steps from the Shadow page, read from where they are applied." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--colors-steel-grey-white);font-family:var(--font-core)}
.ramp{display:flex;gap:0;border-radius:var(--radius-large);overflow:hidden}
.ramp>div{flex:1;height:76px;display:flex;align-items:flex-end;padding:6px;font:var(--weight-medium) 9px/1.3 var(--font-core)}
.sw{display:flex;flex-direction:column;gap:6px}
.chip{height:52px;border-radius:var(--radius-base)}
.meta{font:var(--weight-medium) 9px/1.3 var(--font-core);color:var(--colors-cold-grey-600);letter-spacing:.02em}
.name{font:var(--weight-medium) 10px/1.3 var(--font-core);color:var(--colors-cold-grey-900)}
.grid{display:grid;gap:10px}
</style></head><body><div style="display:flex;gap:16px;padding:8px 0">
<div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:88px;height:88px;border-radius:var(--radius-xl);background:var(--colors-steel-grey-white);box-shadow:inset 0 0 0 1px var(--colors-cold-grey-300)"></div><span class="meta" style="font-size:9px">None</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:88px;height:88px;border-radius:var(--radius-xl);background:var(--colors-steel-grey-white);box-shadow:var(--shadow-button-base)"></div><span class="meta" style="font-size:9px">Button Base</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:88px;height:88px;border-radius:var(--radius-xl);background:var(--colors-steel-grey-white);box-shadow:var(--shadow-base)"></div><span class="meta" style="font-size:9px">Base</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:88px;height:88px;border-radius:var(--radius-xl);background:var(--colors-steel-grey-white);box-shadow:var(--shadow-medium)"></div><span class="meta" style="font-size:9px">Medium</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:88px;height:88px;border-radius:var(--radius-xl);background:var(--colors-steel-grey-white);box-shadow:var(--shadow-large)"></div><span class="meta" style="font-size:9px">Large</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:88px;height:88px;border-radius:var(--radius-xl);background:var(--colors-steel-grey-white);box-shadow:var(--shadow-bold)"></div><span class="meta" style="font-size:9px">Bold</span></div>
</div></body></html>
