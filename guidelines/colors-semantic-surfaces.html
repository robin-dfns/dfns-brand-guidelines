<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces" subtitle="Background base plus four elevation steps, light and dark mode." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--colors-steel-grey-white);font-family:var(--font-core)}
.ramp{display:flex;gap:0;border-radius:var(--radius-large);overflow:hidden}
.ramp>div{flex:1;height:76px;display:flex;align-items:flex-end;padding:6px;font:var(--weight-medium) 9px/1.3 var(--font-core)}
.sw{display:flex;flex-direction:column;gap:6px}
.chip{height:52px;border-radius:var(--radius-base)}
.meta{font:var(--weight-medium) 9px/1.3 var(--font-core);color:var(--colors-cold-grey-600);letter-spacing:.02em}
.name{font:var(--weight-medium) 10px/1.3 var(--font-core);color:var(--colors-cold-grey-900)}
.grid{display:grid;gap:10px}
</style></head><body><div style="display:flex;flex-direction:column;gap:10px">
<div class="ramp"><div style="background:var(--colors-background-b-w);color:#1E202E;height:50px">b-w</div><div style="background:var(--colors-background-base);color:#1E202E;height:50px">base</div><div style="background:var(--colors-background-elevation-1);color:#1E202E;height:50px">elevation-1</div><div style="background:var(--colors-background-elevation-2);color:#1E202E;height:50px">elevation-2</div><div style="background:var(--colors-background-elevation-3);color:#1E202E;height:50px">elevation-3</div><div style="background:var(--colors-background-elevation-4);color:#1E202E;height:50px">elevation-4</div></div>
<div class="ramp" data-theme="dark" style="--colors-background-b-w:var(--colors-dark-purple-black);--colors-background-base:var(--colors-dark-purple-900);--colors-background-elevation-1:var(--colors-dark-purple-700);--colors-background-elevation-2:var(--colors-dark-purple-600);--colors-background-elevation-3:var(--colors-cold-grey-700);--colors-background-elevation-4:var(--colors-cold-grey-900)"><div style="background:var(--colors-background-b-w);color:#fff;height:50px">b-w</div><div style="background:var(--colors-background-base);color:#fff;height:50px">base</div><div style="background:var(--colors-background-elevation-1);color:#fff;height:50px">elevation-1</div><div style="background:var(--colors-background-elevation-2);color:#fff;height:50px">elevation-2</div><div style="background:var(--colors-background-elevation-3);color:#fff;height:50px">elevation-3</div><div style="background:var(--colors-background-elevation-4);color:#fff;height:50px">elevation-4</div></div>
<span class="meta">Top row: light mode. Bottom row: the same tokens under <code>[data-theme="dark"]</code>.</span></div></body></html>
