<!-- @dsCard group="Spacing" viewport="700x130" name="Strokes" subtitle="Six widths. Hairlines are drawn as inset rings, not borders." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--colors-steel-grey-white);font-family:var(--font-core)}
.ramp{display:flex;gap:0;border-radius:var(--radius-large);overflow:hidden}
.ramp>div{flex:1;height:76px;display:flex;align-items:flex-end;padding:6px;font:var(--weight-medium) 9px/1.3 var(--font-core)}
.sw{display:flex;flex-direction:column;gap:6px}
.chip{height:52px;border-radius:var(--radius-base)}
.meta{font:var(--weight-medium) 9px/1.3 var(--font-core);color:var(--colors-cold-grey-600);letter-spacing:.02em}
.name{font:var(--weight-medium) 10px/1.3 var(--font-core);color:var(--colors-cold-grey-900)}
.grid{display:grid;gap:10px}
</style></head><body><div style="display:flex;gap:14px">
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:88px;height:56px;border-radius:var(--radius-large);box-shadow:inset 0 0 0 var(--stroke-none) var(--colors-cold-grey-600)"></div><span class="meta" style="font-size:9px">none · 0px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:88px;height:56px;border-radius:var(--radius-large);box-shadow:inset 0 0 0 var(--stroke-small) var(--colors-cold-grey-600)"></div><span class="meta" style="font-size:9px">small · 0.5px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:88px;height:56px;border-radius:var(--radius-large);box-shadow:inset 0 0 0 var(--stroke-base) var(--colors-cold-grey-600)"></div><span class="meta" style="font-size:9px">base · 1px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:88px;height:56px;border-radius:var(--radius-large);box-shadow:inset 0 0 0 var(--stroke-medium) var(--colors-cold-grey-600)"></div><span class="meta" style="font-size:9px">medium · 1.5px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:88px;height:56px;border-radius:var(--radius-large);box-shadow:inset 0 0 0 var(--stroke-large) var(--colors-cold-grey-600)"></div><span class="meta" style="font-size:9px">large · 2px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:88px;height:56px;border-radius:var(--radius-large);box-shadow:inset 0 0 0 var(--stroke-larger) var(--colors-cold-grey-600)"></div><span class="meta" style="font-size:9px">larger · 4px</span></div>
</div></body></html>
