<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--colors-steel-grey-white);font-family:var(--font-core)}
.ramp{display:flex;gap:0;border-radius:var(--radius-large);overflow:hidden}
.ramp>div{flex:1;height:76px;display:flex;align-items:flex-end;padding:6px;font:var(--weight-medium) 9px/1.3 var(--font-core)}
.sw{display:flex;flex-direction:column;gap:6px}
.chip{height:52px;border-radius:var(--radius-base)}
.meta{font:var(--weight-medium) 9px/1.3 var(--font-core);color:var(--colors-cold-grey-600);letter-spacing:.02em}
.name{font:var(--weight-medium) 10px/1.3 var(--font-core);color:var(--colors-cold-grey-900)}
.grid{display:grid;gap:10px}
</style></head><body><div style="display:flex;gap:22px;align-items:center">
<div style="width:128px;height:128px;border-radius:28px;background:var(--gradient-appicon);box-shadow:inset -1px -15px 3px 0 var(--colors-dark-purple-900),inset 1.5px 5.5px 3px 0 rgba(255,255,255,.2);display:grid;place-items:center"><span style="width:88px;height:77px;background:var(--colors-steel-grey-100);-webkit-mask:url(../assets/appicon-symbol.svg) center/contain no-repeat;mask:url(../assets/appicon-symbol.svg) center/contain no-repeat"></span></div><div style="width:88px;height:88px;border-radius:19px;background:var(--gradient-appicon);box-shadow:inset -1px -10px 3px 0 var(--colors-dark-purple-900),inset 1.5px 5.5px 3px 0 rgba(255,255,255,.2);display:grid;place-items:center"><span style="width:61px;height:53px;background:var(--colors-steel-grey-100);-webkit-mask:url(../assets/appicon-symbol.svg) center/contain no-repeat;mask:url(../assets/appicon-symbol.svg) center/contain no-repeat"></span></div><div style="width:56px;height:56px;border-radius:12px;background:var(--gradient-appicon);box-shadow:inset -1px -7px 3px 0 var(--colors-dark-purple-900),inset 1.5px 5.5px 3px 0 rgba(255,255,255,.2);display:grid;place-items:center"><span style="width:39px;height:34px;background:var(--colors-steel-grey-100);-webkit-mask:url(../assets/appicon-symbol.svg) center/contain no-repeat;mask:url(../assets/appicon-symbol.svg) center/contain no-repeat"></span></div><div style="width:32px;height:32px;border-radius:7px;background:var(--gradient-appicon);box-shadow:inset -1px -4px 3px 0 var(--colors-dark-purple-900),inset 1.5px 5.5px 3px 0 rgba(255,255,255,.2);display:grid;place-items:center"><span style="width:22px;height:19px;background:var(--colors-steel-grey-100);-webkit-mask:url(../assets/appicon-symbol.svg) center/contain no-repeat;mask:url(../assets/appicon-symbol.svg) center/contain no-repeat"></span></div>
<span class="meta" style="max-width:150px">Corner radius tracks 22% of the icon box. Never place the wordmark inside the icon.</span>
</div></body></html>
