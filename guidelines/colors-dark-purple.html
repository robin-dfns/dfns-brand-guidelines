<!-- @dsCard group="Colors" viewport="700x120" name="Dark Purple" subtitle="Deep neutrals for dark-mode surfaces and near-black text." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--colors-steel-grey-white);font-family:var(--font-core)}
.ramp{display:flex;gap:0;border-radius:var(--radius-large);overflow:hidden}
.ramp>div{flex:1;height:76px;display:flex;align-items:flex-end;padding:6px;font:var(--weight-medium) 9px/1.3 var(--font-core)}
.sw{display:flex;flex-direction:column;gap:6px}
.chip{height:52px;border-radius:var(--radius-base)}
.meta{font:var(--weight-medium) 9px/1.3 var(--font-core);color:var(--colors-cold-grey-600);letter-spacing:.02em}
.name{font:var(--weight-medium) 10px/1.3 var(--font-core);color:var(--colors-cold-grey-900)}
.grid{display:grid;gap:10px}
</style></head><body><div class="ramp"><div style="background:var(--colors-dark-purple-100);color:#fff">100</div><div style="background:var(--colors-dark-purple-300);color:#fff">300</div><div style="background:var(--colors-dark-purple-500);color:#fff">500</div><div style="background:var(--colors-dark-purple-600);color:#fff">600</div><div style="background:var(--colors-dark-purple-700);color:#fff">700</div><div style="background:var(--colors-dark-purple-900);color:#fff">900</div><div style="background:var(--colors-dark-purple-black);color:#fff">Black</div></div></body></html>
