<!-- @dsCard group="Effects" viewport="700x150" name="Gradients" subtitle="Two stacked whites over the purple ramp — the only gradients in the system." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--colors-steel-grey-white);font-family:var(--font-core)}
.ramp{display:flex;gap:0;border-radius:var(--radius-large);overflow:hidden}
.ramp>div{flex:1;height:76px;display:flex;align-items:flex-end;padding:6px;font:var(--weight-medium) 9px/1.3 var(--font-core)}
.sw{display:flex;flex-direction:column;gap:6px}
.chip{height:52px;border-radius:var(--radius-base)}
.meta{font:var(--weight-medium) 9px/1.3 var(--font-core);color:var(--colors-cold-grey-600);letter-spacing:.02em}
.name{font:var(--weight-medium) 10px/1.3 var(--font-core);color:var(--colors-cold-grey-900)}
.grid{display:grid;gap:10px}
</style></head><body><div style="display:flex;gap:18px;align-items:center">
<div style="width:190px;height:88px;border-radius:var(--radius-xl);background:var(--gradient-primary);box-shadow:var(--shadow-button-base);display:grid;place-items:center;color:var(--colors-primary-foreground-light);font-weight:500;font-size:14px">Primary</div>
<div style="width:190px;height:88px;border-radius:var(--radius-xl);background:var(--gradient-primary-hover);box-shadow:var(--shadow-button-base);display:grid;place-items:center;color:var(--colors-primary-foreground-light);font-weight:500;font-size:14px">Primary · Hover</div>
<div style="width:110px;height:110px;border-radius:26px;background:var(--gradient-appicon);box-shadow:inset -1px -15px 3px 0 var(--colors-dark-purple-900),inset 1.5px 5.5px 3px 0 rgba(255,255,255,.2)"></div>
<span class="meta" style="max-width:130px">--gradient-primary · --gradient-primary-hover · --gradient-appicon</span>
</div></body></html>
