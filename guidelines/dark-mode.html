<!-- @dsCard group="Colors" viewport="700x180" name="Dark Mode" subtitle="The same semantic tokens under [data-theme="dark"]." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--colors-steel-grey-white);font-family:var(--font-core)}
.ramp{display:flex;gap:0;border-radius:var(--radius-large);overflow:hidden}
.ramp>div{flex:1;height:76px;display:flex;align-items:flex-end;padding:6px;font:var(--weight-medium) 9px/1.3 var(--font-core)}
.sw{display:flex;flex-direction:column;gap:6px}
.chip{height:52px;border-radius:var(--radius-base)}
.meta{font:var(--weight-medium) 9px/1.3 var(--font-core);color:var(--colors-cold-grey-600);letter-spacing:.02em}
.name{font:var(--weight-medium) 10px/1.3 var(--font-core);color:var(--colors-cold-grey-900)}
.grid{display:grid;gap:10px}
</style></head><body><div data-theme="dark" style="padding:20px;border-radius:var(--radius-xl);background:var(--colors-dark-purple-900);display:flex;gap:16px;align-items:center">
<div style="padding:16px;border-radius:var(--radius-xl);background:var(--colors-dark-purple-700);display:flex;flex-direction:column;gap:8px;min-width:210px">
<span style="font-weight:600;font-size:16px;letter-spacing:-.4px;color:var(--colors-cold-grey-100)">Total Balance</span>
<span style="font-size:28px;line-height:1;color:var(--colors-cold-grey-100)">US$5,329</span>
</div>
<span style="padding:2px 10px;border-radius:6px;background:var(--colors-system-green-900);box-shadow:inset 0 0 0 1px var(--colors-system-green-300);font-size:12px;color:var(--colors-system-green-100)">Completed</span>
<span style="padding:2px 10px;border-radius:6px;background:var(--colors-system-yellow-900);box-shadow:inset 0 0 0 1px var(--colors-system-yellow-300);font-size:12px;color:var(--colors-system-yellow-100)">Pending</span>
<span style="padding:8px 16px;border-radius:12px;background:var(--colors-ultra-purple-800);box-shadow:inset 0 0 0 1px var(--colors-ultra-purple-800);font-weight:500;font-size:14px;color:var(--colors-cold-grey-100)">Create Wallet</span>
</div></body></html>
