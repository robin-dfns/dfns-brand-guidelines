<!-- @dsCard group="Colors" viewport="700x120" name="Cold Grey" subtitle="Text, strokes and secondary fills. 600 is the most-used colour in the file." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--colors-steel-grey-white);font-family:var(--font-core)}
.ramp{display:flex;gap:0;border-radius:var(--radius-large);overflow:hidden}
.ramp>div{flex:1;height:76px;display:flex;align-items:flex-end;padding:6px;font:var(--weight-medium) 9px/1.3 var(--font-core)}
.sw{display:flex;flex-direction:column;gap:6px}
.chip{height:52px;border-radius:var(--radius-base)}
.meta{font:var(--weight-medium) 9px/1.3 var(--font-core);color:var(--colors-cold-grey-600);letter-spacing:.02em}
.name{font:var(--weight-medium) 10px/1.3 var(--font-core);color:var(--colors-cold-grey-900)}
.grid{display:grid;gap:10px}
</style></head><body><div class="ramp"><div style="background:var(--colors-cold-grey-100);color:#1E202E">100</div><div style="background:var(--colors-cold-grey-300);color:#1E202E">300</div><div style="background:var(--colors-cold-grey-500);color:#1E202E">500</div><div style="background:var(--colors-cold-grey-600);color:#fff">600</div><div style="background:var(--colors-cold-grey-700);color:#fff">700</div><div style="background:var(--colors-cold-grey-900);color:#fff">900</div></div></body></html>
