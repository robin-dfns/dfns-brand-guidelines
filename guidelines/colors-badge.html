<!-- @dsCard group="Colors" viewport="700x140" name="Badge Palette" subtitle="Fill, border and foreground triples driving the six Badge colours." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--colors-steel-grey-white);font-family:var(--font-core)}
.ramp{display:flex;gap:0;border-radius:var(--radius-large);overflow:hidden}
.ramp>div{flex:1;height:76px;display:flex;align-items:flex-end;padding:6px;font:var(--weight-medium) 9px/1.3 var(--font-core)}
.sw{display:flex;flex-direction:column;gap:6px}
.chip{height:52px;border-radius:var(--radius-base)}
.meta{font:var(--weight-medium) 9px/1.3 var(--font-core);color:var(--colors-cold-grey-600);letter-spacing:.02em}
.name{font:var(--weight-medium) 10px/1.3 var(--font-core);color:var(--colors-cold-grey-900)}
.grid{display:grid;gap:10px}
</style></head><body><div class="grid" style="grid-template-columns:repeat(5,1fr)">
<div style="padding:12px;border-radius:var(--radius-large);background:var(--colors-badge-default);box-shadow:inset 0 0 0 1px var(--colors-badge-default-border)"><div style="font:var(--weight-medium) 12px/1 var(--font-core);color:var(--colors-badge-default-foreground)">Test</div><div class="meta" style="margin-top:8px;color:var(--colors-badge-default-foreground);opacity:.8">default</div></div><div style="padding:12px;border-radius:var(--radius-large);background:var(--colors-badge-success);box-shadow:inset 0 0 0 1px var(--colors-badge-success-border)"><div style="font:var(--weight-medium) 12px/1 var(--font-core);color:var(--colors-badge-success-foreground)">Test</div><div class="meta" style="margin-top:8px;color:var(--colors-badge-success-foreground);opacity:.8">success</div></div><div style="padding:12px;border-radius:var(--radius-large);background:var(--colors-badge-warning);box-shadow:inset 0 0 0 1px var(--colors-badge-warning-border)"><div style="font:var(--weight-medium) 12px/1 var(--font-core);color:var(--colors-badge-warning-foreground)">Test</div><div class="meta" style="margin-top:8px;color:var(--colors-badge-warning-foreground);opacity:.8">warning</div></div><div style="padding:12px;border-radius:var(--radius-large);background:var(--colors-badge-error);box-shadow:inset 0 0 0 1px var(--colors-badge-error-border)"><div style="font:var(--weight-medium) 12px/1 var(--font-core);color:var(--colors-badge-error-foreground)">Test</div><div class="meta" style="margin-top:8px;color:var(--colors-badge-error-foreground);opacity:.8">error</div></div><div style="padding:12px;border-radius:var(--radius-large);background:var(--colors-badge-information);box-shadow:inset 0 0 0 1px var(--colors-badge-information-border)"><div style="font:var(--weight-medium) 12px/1 var(--font-core);color:var(--colors-badge-information-foreground)">Test</div><div class="meta" style="margin-top:8px;color:var(--colors-badge-information-foreground);opacity:.8">information</div></div>
</div></body></html>
