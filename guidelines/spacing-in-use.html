<!-- @dsCard group="Spacing" viewport="700x190" name="Spacing In Use" subtitle="A dashboard card: 24px padding, 12px internal gap, 8px inside rows." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--colors-steel-grey-white);font-family:var(--font-core)}
.ramp{display:flex;gap:0;border-radius:var(--radius-large);overflow:hidden}
.ramp>div{flex:1;height:76px;display:flex;align-items:flex-end;padding:6px;font:var(--weight-medium) 9px/1.3 var(--font-core)}
.sw{display:flex;flex-direction:column;gap:6px}
.chip{height:52px;border-radius:var(--radius-base)}
.meta{font:var(--weight-medium) 9px/1.3 var(--font-core);color:var(--colors-cold-grey-600);letter-spacing:.02em}
.name{font:var(--weight-medium) 10px/1.3 var(--font-core);color:var(--colors-cold-grey-900)}
.grid{display:grid;gap:10px}
</style></head><body><div style="width:420px;padding:var(--space-600);border-radius:var(--radius-xl);background:var(--colors-steel-grey-white);box-shadow:var(--ring-card),var(--shadow-base);display:flex;flex-direction:column;gap:var(--space-300)">
<div style="display:flex;align-items:center;gap:var(--space-200)"><span style="font-weight:600;font-size:16px;letter-spacing:-.4px;color:var(--colors-dark-purple-900)">Total Balance</span></div>
<div style="font-size:36px;line-height:1;color:var(--colors-dark-purple-900)">US$5,329</div>
<div style="display:flex;gap:var(--space-200)"><span style="padding:2px 10px;border-radius:6px;background:var(--colors-badge-success);box-shadow:inset 0 0 0 1px var(--colors-badge-success-border);font-size:12px;color:var(--colors-badge-success-foreground)">+2.4%</span><span class="meta" style="align-self:center">Past week</span></div>
</div>
<span class="meta" style="display:block;margin-top:10px">--space-600 padding · --space-300 stack gap · --space-200 row gap · --radius-xl corner</span></body></html>
