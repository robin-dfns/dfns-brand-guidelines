<!-- @dsCard group="Type" viewport="700x170" name="Labels & Numerals" subtitle="The uppercase section label, table numerals and the truncated-address form." -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--colors-steel-grey-white);font-family:var(--font-core)}
.ramp{display:flex;gap:0;border-radius:var(--radius-large);overflow:hidden}
.ramp>div{flex:1;height:76px;display:flex;align-items:flex-end;padding:6px;font:var(--weight-medium) 9px/1.3 var(--font-core)}
.sw{display:flex;flex-direction:column;gap:6px}
.chip{height:52px;border-radius:var(--radius-base)}
.meta{font:var(--weight-medium) 9px/1.3 var(--font-core);color:var(--colors-cold-grey-600);letter-spacing:.02em}
.name{font:var(--weight-medium) 10px/1.3 var(--font-core);color:var(--colors-cold-grey-900)}
.grid{display:grid;gap:10px}
</style></head><body><div style="display:flex;flex-direction:column;gap:14px">
<div><div class="meta">Section label — Semibold 12, tracking 0.02em, uppercase, Ultra Purple 700</div><div style="font-weight:600;font-size:12px;letter-spacing:.02em;text-transform:uppercase;line-height:26px;color:var(--colors-ultra-purple-700)">New Organisation</div></div>
<div><div class="meta">Balance — Regular 48, solid leading, Dark Purple 900</div><div style="font-weight:400;font-size:48px;line-height:40px;color:var(--colors-dark-purple-900)">US$1,234.56</div></div>
<div style="display:flex;gap:28px">
<div><div class="meta">Right-aligned numerals</div><div style="font-variant-numeric:tabular-nums;font-size:14px;text-align:right;width:120px;color:var(--colors-cold-grey-900)">12,450<br>1.2M<br>-3.4%<br>12.54 BTC</div></div>
<div><div class="meta">Truncated address</div><div style="font-family:var(--font-mono);font-size:14px;color:var(--colors-cold-grey-900)">0xd6…34e5…1a85</div></div>
<div><div class="meta">Timestamp — left aligned</div><div style="font-size:14px;color:var(--colors-cold-grey-900)">2024-08-17 17:24</div></div>
</div></div></body></html>
