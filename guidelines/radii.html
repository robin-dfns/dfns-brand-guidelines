<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--colors-steel-grey-white);font-family:var(--font-core)}
.ramp{display:flex;gap:0;border-radius:var(--radius-large);overflow:hidden}
.ramp>div{flex:1;height:76px;display:flex;align-items:flex-end;padding:6px;font:var(--weight-medium) 9px/1.3 var(--font-core)}
.sw{display:flex;flex-direction:column;gap:6px}
.chip{height:52px;border-radius:var(--radius-base)}
.meta{font:var(--weight-medium) 9px/1.3 var(--font-core);color:var(--colors-cold-grey-600);letter-spacing:.02em}
.name{font:var(--weight-medium) 10px/1.3 var(--font-core);color:var(--colors-cold-grey-900)}
.grid{display:grid;gap:10px}
</style></head><body><div style="display:flex;align-items:flex-end;gap:12px">
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:62px;height:56px;border-radius:var(--radius-none);background:var(--colors-steel-grey-200);box-shadow:inset 0 0 0 1px var(--colors-cold-grey-300)"></div><span class="meta" style="font-size:9px">none · 0</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:62px;height:56px;border-radius:var(--radius-small);background:var(--colors-steel-grey-200);box-shadow:inset 0 0 0 1px var(--colors-cold-grey-300)"></div><span class="meta" style="font-size:9px">small · 2</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:62px;height:56px;border-radius:var(--radius-medium);background:var(--colors-steel-grey-200);box-shadow:inset 0 0 0 1px var(--colors-cold-grey-300)"></div><span class="meta" style="font-size:9px">medium · 4</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:62px;height:56px;border-radius:var(--radius-base);background:var(--colors-steel-grey-200);box-shadow:inset 0 0 0 1px var(--colors-cold-grey-300)"></div><span class="meta" style="font-size:9px">base · 6</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:62px;height:56px;border-radius:var(--radius-large);background:var(--colors-steel-grey-200);box-shadow:inset 0 0 0 1px var(--colors-cold-grey-300)"></div><span class="meta" style="font-size:9px">large · 8</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:62px;height:56px;border-radius:var(--radius-xl);background:var(--colors-steel-grey-200);box-shadow:inset 0 0 0 1px var(--colors-cold-grey-300)"></div><span class="meta" style="font-size:9px">xl · 12</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:62px;height:56px;border-radius:var(--radius-2xl);background:var(--colors-steel-grey-200);box-shadow:inset 0 0 0 1px var(--colors-cold-grey-300)"></div><span class="meta" style="font-size:9px">2xl · 16</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:62px;height:56px;border-radius:var(--radius-3xl);background:var(--colors-steel-grey-200);box-shadow:inset 0 0 0 1px var(--colors-cold-grey-300)"></div><span class="meta" style="font-size:9px">3xl · 20</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:62px;height:56px;border-radius:var(--radius-4xl);background:var(--colors-steel-grey-200);box-shadow:inset 0 0 0 1px var(--colors-cold-grey-300)"></div><span class="meta" style="font-size:9px">4xl · 24</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:62px;height:56px;border-radius:var(--radius-full);background:var(--colors-steel-grey-200);box-shadow:inset 0 0 0 1px var(--colors-cold-grey-300)"></div><span class="meta" style="font-size:9px">full · pill</span></div>
</div></body></html>
