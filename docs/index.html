<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DFNS Design System</title>
<script>(function(){if((localStorage.getItem('theme')||'light')==='dark')document.documentElement.classList.add('dark');})();</script>
<link rel="stylesheet" href="../tokens/index.css">
<style>
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:var(--font-sans);background:var(--background-base);color:var(--font-body-base);-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .layout{min-height:100dvh}
  /* ---------- sidebar ---------- */
  .side{position:sticky;top:0;align-self:start;height:100dvh;display:flex;flex-direction:column;gap:4px;
        padding:22px 16px;border-right:1px solid var(--stroke-tertiary);background:var(--background-bw)}
  .brand{display:flex;align-items:center;gap:8px;padding:6px 8px 18px;font-size:14px;font-weight:var(--weight-medium);color:var(--font-heading-grey)}
  .brand svg{height:18px;width:auto;fill:currentColor}
  .brand b{color:var(--font-heading-colored-mid)}
  .navlink{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-base);
           font-size:13px;font-weight:var(--weight-medium);color:var(--font-body-bright);cursor:pointer}
  .navlink:hover{background:var(--background-base);color:var(--font-body-base)}
  .navlink.active{background:color-mix(in srgb,var(--base-primary) 10%,transparent);color:var(--font-heading-colored-mid)}
  .navlink .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55}
  a.brand{text-decoration:none;cursor:pointer}
  a.brand:hover{opacity:.82}
  .navback{color:var(--font-heading-colored-mid);text-decoration:none}
  .navback svg{opacity:.85}
  .navback:hover{background:var(--background-base)}
  .navcap{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--font-body-bright);padding:14px 12px 4px}
  .side-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding:8px}
  .side-foot a{font-family:var(--font-mono);font-size:11px;color:var(--font-body-bright)}
  .themebtn{height:30px;padding:0 12px;border:1px solid var(--stroke-tertiary);border-radius:var(--radius-base);
            background:transparent;color:var(--font-body-base);font-family:var(--font-sans);font-size:12px;cursor:pointer}
  /* ---------- main ---------- */
  main{padding:100px clamp(24px,4vw,56px) 96px;max-width:1100px;margin:0 auto}
  .sec{display:none}.sec.active{display:block}
  h1{font-weight:var(--weight-light);font-size:40px;margin:0 0 6px;letter-spacing:-.4px;color:var(--font-heading-grey)}
  h1 .a{color:var(--font-heading-colored-mid)}
  .lead{margin:0 0 8px;font-size:16px;color:var(--font-body-bright);max-width:62ch}
  h2{font-weight:var(--weight-light);font-size:24px;margin:44px 0 4px;color:var(--font-heading-grey)}
  .sub{margin:0 0 18px;font-size:13px;color:var(--font-body-bright)}
  .mono{font-family:var(--font-mono)}
  /* swatches / tiles */
  .grid{display:grid;gap:12px}
  .g4{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .g6{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
  .badges{display:flex;flex-wrap:wrap;gap:8px}
  .spec{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end}
  /* buttons preview */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:12px;
       border:none;font-family:var(--font-sans);font-weight:var(--weight-medium);font-size:14px;cursor:pointer;line-height:1}
  .btn.primary{background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,0)),linear-gradient(0deg,#2d1866,#442599);box-shadow:inset 0 0 0 1px #2d1866;color:#e0e3f0}
  .btn.secondary{background:#e0e3f0;color:#442599}
  .btn.outline{background:transparent;color:#442599;box-shadow:inset 0 0 0 2px #442599}
  .btn.ghost{background:var(--background-bw);color:#363a5b;box-shadow:inset 0 0 0 1px #e0e3f0}
  .btn.disabled{background:#e8eaf0;color:#aeb1c9;box-shadow:none;cursor:default}
  .btn-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .cta{display:inline-flex;align-items:center;gap:8px;height:36px;border-radius:12px;font-family:var(--font-sans);font-weight:var(--weight-medium);font-size:14px;cursor:pointer;border:none;text-decoration:none}
  .cta.primary{padding:0 14px 0 18px;background:linear-gradient(rgba(255,255,255,.12),rgba(255,255,255,.12)),linear-gradient(0deg,#2d1866,#442599);color:#e0e3f0;border:1px solid #170c33;box-shadow:0 6px 12px rgba(87,91,123,.24)}
  .cta.secondary{padding:0 18px;background:#e0e3f0;color:#442599}
  .cta.tertiary{padding:0;height:auto;background:transparent;color:var(--font-heading-colored-mid)}
  .eyebrow{display:inline-flex;align-items:center;gap:5px;padding:6px 9px;border-radius:6px;font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;background:color-mix(in srgb,var(--success-base) 15%,transparent);color:var(--success-text)}
  .eyebrow.info{background:color-mix(in srgb,var(--system-blue-500) 15%,transparent);color:var(--system-blue-500)}
  .eyebrow .hx{width:8px;height:9px;animation:hexblink 2s step-end infinite}
  @keyframes hexblink{0%,100%{opacity:1}50%{opacity:0}}
  /* ---- components section: side menu + cards ---- */
  .comp-main{max-width:940px;min-width:0}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;transition:.25s;
         background:var(--font-body-base);color:var(--background-bw);padding:9px 16px;border-radius:999px;font-size:13px;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media(max-width:820px){.layout{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border-right:none;border-bottom:1px solid var(--stroke-tertiary)}.side-foot{margin:0}}
</style>
</head>
<body>
<div id="dsnav"></div>
<div class="layout">
  <main>
    <!-- ============ FOUNDATIONS ============ -->




    <!-- ============ COMPONENTS ============ -->


  </main>
</div>
<div class="toast" id="toast">Copied</div>

<script type="module">

/* ---------- theme ---------- */
window.toggleTheme = () => {
  const d = document.documentElement.classList.toggle('dark');
  document.getElementById('themeBtn').textContent = d ? 'Light' : 'Dark';
};

/* ---------- section nav ---------- */
function showSection(sec) {
  if (!document.getElementById('sec-' + sec)) sec = 'components';
  document.querySelectorAll('.sec').forEach(s => s.classList.toggle('active', s.id === 'sec-' + sec));
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', () => showSection((location.hash || '#components').slice(1)));

showSection((location.hash || '#components').slice(1));
</script>
<script>
/* Switchers open/close via native <details> (works with zero JS). This is a
   progressive enhancement only: close an open one when clicking outside it. */
(function () {
  document.addEventListener('click', function (e) {
    document.querySelectorAll('details.swx-det[open]').forEach(function (d) {
      if (!d.contains(e.target)) d.removeAttribute('open');
    });
    var live = e.target.closest('.sb-live');
    if (live) live.classList.toggle('active');
  });
})();
</script>
<script src="../nav.js"></script>
</body>
</html>
