<!-- @dsCard group="Colors" viewport="700x190" name="System Colors" subtitle="Blue / Green / Red / Yellow status scales" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--background-base);font-family:var(--font-mono);font-size:10px}
.row{display:flex;gap:6px;margin-bottom:6px;align-items:center}.lbl{width:44px;color:#575c7b}.sw{flex:1;height:30px;border-radius:6px}</style>
</head><body>
<div class="row"><span class="lbl">blue</span><div class="sw" style="background:var(--system-blue-100)"></div><div class="sw" style="background:var(--system-blue-300)"></div><div class="sw" style="background:var(--system-blue-500)"></div><div class="sw" style="background:var(--system-blue-700)"></div><div class="sw" style="background:var(--system-blue-900)"></div></div>
<div class="row"><span class="lbl">green</span><div class="sw" style="background:var(--system-green-100)"></div><div class="sw" style="background:var(--system-green-300)"></div><div class="sw" style="background:var(--system-green-500)"></div><div class="sw" style="background:var(--system-green-700)"></div><div class="sw" style="background:var(--system-green-900)"></div></div>
<div class="row"><span class="lbl">red</span><div class="sw" style="background:var(--system-red-100)"></div><div class="sw" style="background:var(--system-red-300)"></div><div class="sw" style="background:var(--system-red-500)"></div><div class="sw" style="background:var(--system-red-700)"></div><div class="sw" style="background:var(--system-red-900)"></div></div>
<div class="row" style="margin-bottom:0"><span class="lbl">yellow</span><div class="sw" style="background:var(--system-yellow-100)"></div><div class="sw" style="background:var(--system-yellow-300)"></div><div class="sw" style="background:var(--system-yellow-500)"></div><div class="sw" style="background:var(--system-yellow-700)"></div><div class="sw" style="background:var(--system-yellow-900)"></div></div>
</body></html>
