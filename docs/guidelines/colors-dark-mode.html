<!-- @dsCard group="Colors" viewport="700x170" name="Dark Mode" subtitle="Semantic remap: dark-purple surfaces, cold-grey text" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:0;font-family:var(--font-sans)}</style>
</head><body class="dark">
<div style="background:var(--background-base);padding:20px;display:flex;gap:16px;align-items:center;min-height:130px;box-sizing:border-box">
  <div style="background:var(--background-elevation-1);border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:6px">
    <span style="font-weight:600;font-size:16px;color:var(--font-bw)">Wallets</span>
    <span style="font-weight:300;font-size:28px;color:var(--font-heading-colored-bright)">1.4k</span>
  </div>
  <div style="background:var(--background-elevation-2);border-radius:12px;padding:16px 20px;color:var(--font-body-mid);font-size:14px;line-height:20px;max-width:280px">Dark mode remaps the same semantic tokens — components don't change.</div>
  <span style="display:inline-flex;padding:2px 10px;border-radius:6px;background:var(--badge-success);box-shadow:inset 0 0 0 1px var(--badge-success-border);color:var(--badge-success-foreground);font-size:12px;font-weight:600">Confirmed</span>
</div>
</body></html>
