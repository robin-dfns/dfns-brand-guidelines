<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">

<div class="sw" style="background:#e3e4eb;color:#575c7b">elev 2</div>
<div class="sw" style="background:#d7d8e1;color:#575c7b">elev 3</div>
</div>
<div class="half">
<div class="sw" style="background:#170c33;color:#d6c8ff">base·dark</div>
<div class="sw" style="background:#1d0e42;color:#d6c8ff">elev 1</div>
