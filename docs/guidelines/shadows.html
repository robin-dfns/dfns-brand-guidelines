<!-- @dsCard group="Spacing" viewport="700x180" name="Shadows & Rings" subtitle="Soft cool-grey drops; 1px inset rings instead of borders" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;background:var(--background-base);font-family:var(--font-mono);font-size:10px;color:#575c7b;display:flex;gap:22px}
.tok{display:flex;flex-direction:column;gap:10px;align-items:center}.sq{width:92px;height:92px;border-radius:12px;background:#fff}</style>
</head><body>
<div class="tok"><div class="sq" style="box-shadow:var(--shadow-sm)"></div>sm</div>
<div class="tok"><div class="sq" style="box-shadow:var(--shadow-base)"></div>base</div>
<div class="tok"><div class="sq" style="box-shadow:var(--shadow-md)"></div>md</div>
<div class="tok"><div class="sq" style="box-shadow:var(--shadow-lg)"></div>lg</div>
<div class="tok"><div class="sq" style="box-shadow:inset 0 0 0 1px #c5c9de"></div>inset ring</div>
<div class="tok"><div class="sq" style="box-shadow:inset 0 0 0 1px rgba(121,111,255,0.3),0 10px 20px rgba(0,0,0,0.1)"></div>hero panel</div>
</body></html>
