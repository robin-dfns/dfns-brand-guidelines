<!-- @dsCard group="Colors" viewport="700x210" name="Neutrals" subtitle="Steel Grey surfaces · Cold Grey text · Dark Purple depths" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--background-base);font-family:var(--font-mono);font-size:10px}
.row{display:flex;gap:6px;margin-bottom:6px}.sw{flex:1;height:52px;border-radius:6px;padding:6px 8px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end}</style>
</head><body>
<div class="row">
<div class="sw" style="background:var(--steel-grey-white);box-shadow:inset 0 0 0 1px #e3e4eb;color:#575c7b">steel white</div>
<div class="sw" style="background:var(--steel-grey-100);box-shadow:inset 0 0 0 1px #e3e4eb;color:#575c7b">steel 100</div>
<div class="sw" style="background:var(--steel-grey-200);color:#575c7b">steel 200</div>
<div class="sw" style="background:var(--steel-grey-300);color:#575c7b">steel 300</div>
<div class="sw" style="background:var(--steel-grey-400);color:#575c7b">steel 400</div>
<div class="sw" style="background:var(--steel-grey-500);color:#363a5b">steel 500</div>
<div class="sw" style="background:var(--steel-grey-600);color:#363a5b">steel 600</div>
</div>
<div class="row">
<div class="sw" style="background:var(--cold-grey-100);color:#575c7b">cold 100</div>
<div class="sw" style="background:var(--cold-grey-300);color:#363a5b">cold 300</div>
<div class="sw" style="background:var(--cold-grey-500);color:#1e202e">cold 500</div>
<div class="sw" style="background:var(--cold-grey-600);color:#e0e3f0">cold 600</div>
<div class="sw" style="background:var(--cold-grey-700);color:#e0e3f0">cold 700</div>
<div class="sw" style="background:var(--cold-grey-900);color:#e0e3f0">cold 900</div>
</div>
<div class="row" style="margin-bottom:0">
<div class="sw" style="background:var(--dark-purple-100);color:#e6deff">dark 100</div>
<div class="sw" style="background:var(--dark-purple-300);color:#e6deff">dark 300</div>
<div class="sw" style="background:var(--dark-purple-500);color:#e6deff">dark 500</div>
<div class="sw" style="background:var(--dark-purple-600);color:#e6deff">dark 600</div>
<div class="sw" style="background:var(--dark-purple-700);color:#e6deff">dark 700</div>
<div class="sw" style="background:var(--dark-purple-900);color:#e6deff">dark 900</div>
</div>
</body></html>
