<script type="text/babel">
/* DFNS Dashboard shell — sidebar + top bar. Composed from the design-system primitives.
   Card treatment (white, radius 12, --ring-card, --shadow-base), the uppercase section label
   and the 24px card padding are transcribed from the Quickstart Guide frame (node 890:8772). */

const { Logotype, Icon, IconCopy, Input, Button, Badge } = window.DFNSDesignSystem_86e15f;

const NAV_TOP = [
  { label: 'Dashboard', view: 'Dashboard', icon: 'HeroiconsMiniHome' },
  { label: 'Activity', view: 'Transfers', icon: 'HeroiconsMiniPresentationChartLine', badge: 3 },
  { label: 'Wallets', view: 'Wallets', icon: 'HeroiconsMiniWallet' },
];

const NAV_GROUPS = [
  {
    key: 'Operations', label: 'Operations', icon: 'HeroiconsMiniBookOpen',
    items: [
      { label: 'Wallets', view: 'Wallets' },
      { label: 'Staking', view: 'Staking' },
      { label: 'Swaps', view: 'Swaps', disabled: true },
      { label: 'Allocations', view: 'Allocations' },
      { label: 'Smart Contract', view: 'Smart Contract' },
      { label: 'Payouts', view: 'Payouts' },
    ],
  },
  {
    key: 'Organization', label: 'Organization', icon: 'HeroiconsMiniBookOpen',
    items: [
      { label: 'Users', view: 'Users' },
      { label: 'Policies', view: 'Policies', badge: 3 },
      { label: 'Roles', view: 'Roles' },
      { label: 'Address Book', view: 'Address Book' },
      { label: 'Billing', view: 'Billing' },
    ],
  },
];

const NAV_BOTTOM = [
  { label: 'Integrations', view: 'Integrations', icon: 'HeroiconsMiniLink' },
  { label: 'Settings', view: 'Settings', icon: 'HeroiconsMiniLink' },
];

const CONNECTED_INTEGRATIONS = [
  { label: 'Uniswap', mark: 'U' },
  { label: 'Coinbase', mark: 'C' },
];

function NavRow({ icon, label, active, badge, disabled, indent, trailing, onClick }) {
  return (
    <button type="button" onClick={disabled ? undefined : onClick} style={{
      display: 'flex', alignItems: 'center', gap: 'var(--space-250)', width: '100%',
      height: 'var(--control-h-9)', padding: `0 var(--space-300) 0 ${indent ? 'calc(var(--space-300) + 30px)' : 'var(--space-300)'}`,
      border: 'none', borderRadius: 'var(--radius-large)', cursor: disabled ? 'default' : 'pointer', textAlign: 'left',
      background: active ? 'var(--colors-ultra-purple-50)' : 'transparent',
      color: disabled ? 'var(--colors-cold-grey-500)' : active ? 'var(--colors-ultra-purple-700)' : 'var(--colors-cold-grey-600)',
      font: `var(--weight-medium) var(--text-base)/var(--line-m) var(--font-core)`,
    }}>
      {icon && <Icon name={icon} size={20} />}
      <span style={{ flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{label}</span>
      {badge != null && <Badge>{badge}</Badge>}
      {trailing}
    </button>
  );
}

function NavGroup({ icon, label, items, active, onNavigate, open, onToggle }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--space-50)' }}>
      <NavRow icon={icon} label={label} onClick={onToggle}
        trailing={<Icon name={open ? 'HeroiconsMiniChevronDown' : 'HeroiconsMiniChevronRight'} size={16} />} />
      {open && items.map(it => (
        <NavRow key={it.label} label={it.label} indent disabled={it.disabled} badge={it.badge}
          active={it.view === active} onClick={() => onNavigate(it.view)} />
      ))}
    </div>
  );
}

function IntegrationRow({ label, mark }) {
  return (
    <div style={{
      display: 'flex', alignItems: 'center', gap: 'var(--space-250)',
      height: 'var(--control-h-9)', padding: '0 var(--space-300)',
      font: `var(--weight-medium) var(--text-base)/var(--line-m) var(--font-core)`, color: 'var(--colors-cold-grey-600)',
    }}>
      <span style={{
        display: 'grid', placeItems: 'center', width: 20, height: 20, flex: 'none',
        borderRadius: 'var(--radius-base)', background: 'var(--colors-cold-grey-900)', color: 'var(--colors-steel-grey-white)',
        font: `var(--weight-bold) var(--text-xs)/1 var(--font-core)`,
      }}>{mark}</span>
      {label}
    </div>
  );
}

function Sidebar({ active, onNavigate }) {
  const [open, setOpen] = React.useState({ Operations: true, Organization: true });
  const toggle = key => setOpen(o => ({ ...o, [key]: !o[key] }));
  return (
    <aside style={{
      width: 264, flex: 'none', alignSelf: 'stretch',
      background: 'var(--colors-steel-grey-white)',
      boxShadow: 'inset -1px 0 0 var(--colors-border-light)',
      display: 'flex', flexDirection: 'column', gap: 'var(--space-500)', padding: 'var(--space-500)',
    }}>
      <Logotype height={26} />
      <nav style={{ display: 'flex', flexDirection: 'column', gap: 'var(--space-50)' }}>
        {NAV_TOP.map(n => (
          <NavRow key={n.label} icon={n.icon} label={n.label} badge={n.badge} active={n.view === active} onClick={() => onNavigate(n.view)} />
        ))}
        {NAV_GROUPS.map(g => (
          <NavGroup key={g.key} icon={g.icon} label={g.label} items={g.items} active={active}
            onNavigate={onNavigate} open={open[g.key]} onToggle={() => toggle(g.key)} />
        ))}
        {NAV_BOTTOM.map(n => (
          <NavRow key={n.label} icon={n.icon} label={n.label} active={n.view === active} onClick={() => onNavigate(n.view)} />
        ))}
      </nav>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--space-50)' }}>
        <span style={{
          padding: '0 var(--space-300)', font: 'var(--weight-medium) var(--text-xs)/1.6 var(--font-core)',
          letterSpacing: '.06em', textTransform: 'uppercase', color: 'var(--colors-cold-grey-500)',
        }}>Integrations</span>
        {CONNECTED_INTEGRATIONS.map(c => <IntegrationRow key={c.label} {...c} />)}
      </div>
      <button type="button" style={{
        marginTop: 'auto', display: 'flex', alignItems: 'center', gap: 'var(--space-250)',
        border: 'none', background: 'none', cursor: 'pointer', padding: 'var(--space-200) var(--space-300)', textAlign: 'left',
      }}>
        <span style={{
          display: 'grid', placeItems: 'center', width: 32, height: 32, flex: 'none', borderRadius: 'var(--radius-full)',
          background: 'var(--colors-ultra-purple-700)', color: 'var(--colors-steel-grey-white)',
          font: `var(--weight-bold) var(--text-s)/1 var(--font-core)`,
        }}>R</span>
        <span style={{ display: 'flex', flexDirection: 'column', gap: 1, minWidth: 0, overflow: 'hidden' }}>
          <span style={{ font: 'var(--weight-medium) var(--text-s)/1.3 var(--font-core)', color: 'var(--colors-dark-purple-900)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>Robert</span>
          <span style={{ font: 'var(--weight-base) var(--text-xs)/1.3 var(--font-core)', color: 'var(--colors-cold-grey-500)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>robert@dfns.com</span>
        </span>
        <Icon name="HeroiconsMiniChevronUpDown" size={16} style={{ marginLeft: 'auto', flex: 'none', color: 'var(--colors-cold-grey-500)' }} />
      </button>
    </aside>
  );
}

function TopBar({ title, onSearch }) {
  return (
    <header style={{
      display: 'flex', alignItems: 'center', gap: 'var(--space-400)',
      padding: 'var(--space-400) var(--space-800)',
      background: 'var(--colors-steel-grey-white)',
      boxShadow: 'inset 0 -1px 0 var(--colors-border-light)',
    }}>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--space-100)' }}>
        <span style={{ font: 'var(--weight-bold) var(--text-s)/1 var(--font-core)', letterSpacing: '.02em', textTransform: 'uppercase', color: 'var(--colors-ultra-purple-700)' }}>Northwind Group</span>
        <span style={{ display: 'flex', alignItems: 'center', gap: 'var(--space-200)', font: 'var(--weight-base) var(--text-s)/1 var(--font-core)', letterSpacing: 'var(--tracking-tight)', color: 'var(--colors-cold-grey-600)' }}>
          Org ID: 93540580980203458590345 <IconCopy size={16} style={{ color: 'var(--colors-cold-grey-600)' }} />
        </span>
      </div>
      <div style={{ marginLeft: 'auto', width: 280 }}>
        <Input placeholder="Search wallets, transfers, users" onChange={e => onSearch(e.target.value)}
          leadingIcon={<Icon name="HeroiconsMiniMagnifyingGlass" size={16} style={{ color: 'var(--colors-cold-grey-500)' }} />} />
      </div>
      <Button variant="ghost" size="icon" leadingIcon={<Icon name="HeroiconsMiniBell" size={20} />} aria-label="Notifications" />
      <span style={{
        width: 36, height: 36, borderRadius: 'var(--radius-full)', flex: 'none',
        background: 'url(../../assets/images/avatar-jane.png) 25.767% 16.977% / 637.795% 251.163% no-repeat, rgb(61,41,153)',
      }} />
    </header>
  );
}

function Card({ children, style, padded = true }) {
  return (
    <section style={{
      background: 'var(--colors-steel-grey-white)',
      borderRadius: 'var(--radius-xl)',
      boxShadow: 'var(--ring-card), var(--shadow-base)',
      padding: padded ? 'var(--space-600)' : 0,
      display: 'flex', flexDirection: 'column', gap: 'var(--space-300)',
      ...style,
    }}>{children}</section>
  );
}

function SectionLabel({ children }) {
  return <span style={{ font: 'var(--weight-bold) var(--text-s)/var(--line-l) var(--font-core)', letterSpacing: '.02em', textTransform: 'uppercase', color: 'var(--colors-ultra-purple-700)' }}>{children}</span>;
}

Object.assign(window, { Sidebar, TopBar, Card, SectionLabel });
</script>
<script type="text/babel">
/* The four dashboard views. Content is abbreviated (a handful of rows standing in for many)
   but every treatment comes from the design system. */

const { Button, Badge, CardHeader, Icon, IconCopy, IconInfoTooltip, IconLoaderCircle, CryptoIcon, Input, CTATertiary } = window.DFNSDesignSystem_86e15f;
const { Card, SectionLabel } = window;

const num = { fontVariantNumeric: 'tabular-nums' };
const th = { font: 'var(--weight-medium) var(--text-s)/var(--line-base) var(--font-core)', color: 'var(--colors-cold-grey-600)', padding: '0 0 var(--space-300)', textAlign: 'left', whiteSpace: 'nowrap' };
const td = { font: 'var(--weight-base) var(--text-base)/var(--line-m) var(--font-core)', color: 'var(--colors-cold-grey-900)', padding: 'var(--space-300) 0', borderTop: '1px solid var(--colors-border-light)' };

const WALLETS = [
  { name: 'Northwind Treasury', symbol: 'Bitcoin', network: 'Bitcoin', asset: '12.54 BTC', value: 'US$1,215,400', address: '0xd6…34e5…1a85', status: ['green', 'Active'] },
  { name: 'Ops Hot Wallet', symbol: 'Ethereum', network: 'Ethereum', asset: '184.2 ETH', value: 'US$612,800', address: '0x91…7c02…44b9', status: ['green', 'Active'] },
  { name: 'Settlement USDC', symbol: 'USDCoin', network: 'Polygon', asset: '1.2M USDC', value: 'US$1,200,000', address: '0x4f…9ad1…0c73', status: ['yellow', 'Pending'] },

];

const TRANSFERS = [
  { date: '2024-08-17 17:24', wallet: 'Northwind Treasury', to: '0xd6…34e5…1a85', amount: '-0.85 BTC', fiat: '-US$82,340', status: ['green', 'Completed'] },
  { date: '2024-08-17 14:02', wallet: 'Settlement USDC', to: '0x4f…9ad1…0c73', amount: '250,000 USDC', fiat: 'US$250,000', status: ['blue', 'Broadcasted'] },
  { date: '2024-08-17 09:41', wallet: 'Ops Hot Wallet', to: '0x91…7c02…44b9', amount: '-12.4 ETH', fiat: '-US$41,200', status: ['yellow', 'Pending'] },

];

const POLICIES = [
  { name: 'Transfer Approval Over US$100,000', scope: 'All wallets', rule: 'Two of four approvers', status: ['green', 'Active'] },

];

const APPROVALS = [

  { wallet: 'Settlement USDC', amount: '250,000 USDC', requester: 'Marc Dupont', age: 'Yesterday', policy: 'Allowlist Only' },
];

function Metric({ label, value, delta, tooltip }) {
  return (
    <Card style={{ flex: 1, gap: 'var(--space-300)' }}>
      <span style={{ display: 'flex', alignItems: 'center', gap: 'var(--space-100)', font: 'var(--weight-medium) var(--text-m)/1 var(--font-core)', letterSpacing: 'var(--tracking-tight)', color: 'var(--colors-dark-purple-900)' }}>
        {label}{tooltip && <IconInfoTooltip content={tooltip} />}
      </span>
      <span style={{ ...num, font: 'var(--weight-base) var(--text-4xl)/1 var(--font-core)', color: 'var(--colors-dark-purple-900)' }}>{value}</span>
      {delta && <span style={{ display: 'flex', alignItems: 'center', gap: 'var(--space-200)' }}>
        <Badge color={delta.startsWith('-') ? 'red' : 'green'}>{delta}</Badge>
        <span style={{ font: 'var(--weight-base) var(--text-s)/1 var(--font-core)', color: 'var(--colors-cold-grey-600)' }}>Past week</span>
      </span>}
    </Card>
  );
}

function Overview({ onNavigate }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--space-600)' }}>
      <div style={{ display: 'flex', gap: 'var(--space-400)' }}>
        <Metric label="Total Balance" value="US$4,200,000" delta="+2.4%" tooltip="The combined fiat value of every asset held across the wallets in this organisation." />
        <Metric label="Wallets" value="24" />
        <Metric label="Pending Approvals" value="2" />
      </div>
      <div style={{ display: 'flex', gap: 'var(--space-400)', alignItems: 'flex-start' }}>
        <Card style={{ flex: 1 }}>
          <CardHeader title="Recent Transfers" description="Activity across all wallets in this organisation."
            trailing={<Button variant="ghost" size="sm" onClick={() => onNavigate('Transfers')}>View All Activities</Button>} />
          <table style={{ width: '100%', borderCollapse: 'collapse' }}>
            <thead><tr><th style={th}>Date</th><th style={th}>Wallet</th><th style={{ ...th, textAlign: 'right' }}>Amount</th><th style={{ ...th, textAlign: 'right' }}>Status</th></tr></thead>

                <td style={{ ...td, textAlign: 'right' }}><Badge color={t.status[0]}>{t.status[1]}</Badge></td>

            <span style={{ font: 'var(--weight-base) var(--text-xl)/1.05 var(--font-core)', letterSpacing: 'var(--tracking-tight)', color: 'var(--colors-dark-purple-900)' }}>New Wallet</span>
            <span style={{ font: 'var(--weight-base) var(--text-base)/var(--line-l) var(--font-core)', color: 'var(--colors-cold-grey-600)' }}>Take your first step with DFNS by creating a wallet.</span>
            <div style={{ display: 'flex', gap: 'var(--space-300)' }}>
              <Button leadingIcon={<Icon name="HeroiconsMiniWallet" size={16} />} onClick={() => onNavigate('Wallets')}>Create Wallet</Button>
              <Button variant="secondary" trailingIcon={<Icon name="HeroiconsMiniArrowTopRight" size={16} />}>Read Docs</Button>
            </div>
          </div>
        </Card>
      </div>
    </div>
  );
}

function Wallets({ onCreate }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--space-400)' }}>
      <div style={{ display: 'flex', alignItems: 'flex-end', gap: 'var(--space-400)' }}>
        <CardHeader title="Wallets" description="24 wallets across 7 networks." />

          <thead><tr><th style={th}>Wallet</th><th style={th}>Network</th><th style={th}>Address</th><th style={{ ...th, textAlign: 'right' }}>Asset</th><th style={{ ...th, textAlign: 'right' }}>Value</th><th style={{ ...th, textAlign: 'right' }}>Status</th></tr></thead>
          <tbody>{WALLETS.map(w => (
            <tr key={w.name}>

              <td style={td}><span style={{ display: 'flex', alignItems: 'center', gap: 'var(--space-200)', color: 'var(--colors-cold-grey-700)' }}><CryptoIcon symbol={w.symbol} shape="square" size={20} />{w.network}</span></td>
              <td style={td}><span style={{ display: 'flex', alignItems: 'center', gap: 'var(--space-200)', fontFamily: 'var(--font-mono)', fontSize: 'var(--text-s)', color: 'var(--colors-cold-grey-700)' }}>{w.address}<IconCopy size={16} style={{ color: 'var(--colors-cold-grey-500)' }} /></span></td>
              <td style={{ ...td, ...num, textAlign: 'right' }}>{w.asset}</td>

function Transfers({ loading }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 'var(--space-400)' }}>
      <div style={{ display: 'flex', alignItems: 'flex-end', gap: 'var(--space-400)' }}>
        <CardHeader title="Transaction History" description="Every inbound and outbound transfer, newest first." />
        <div style={{ marginLeft: 'auto', display: 'flex', gap: 'var(--space-300)' }}>
          <Button variant="ghost" leadingIcon={<Icon name="HeroiconsMiniArrowDownTray" size={16} />}>Export History</Button>
          <Button leadingIcon={<Icon name="HeroiconsMiniArrowUpRight" size={16} />}>Send</Button>

                <td style={{ ...td, ...num, textAlign: 'right' }}>{t.amount}</td>
                <td style={{ ...td, ...num, textAlign: 'right', color: t.fiat.startsWith('-') ? 'var(--colors-error-text)' : 'var(--colors-success-text)' }}>{t.fiat}</td>

function Policies({ onApprove, approved }) {

function RowActionsMenu({ label, onEdit, onDelete }) {
  const [open, setOpen] = React.useState(false);

    if (!open) return;
    const close = e => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', close);
    return () => document.removeEventListener('mousedown', close);
  }, [open]);
  return (
    <div ref={ref} style={{ position: 'relative', display: 'inline-block' }}>
      <Button variant="ghost" size="icon" aria-label={label + ' actions'} onClick={() => setOpen(o => !o)}

<script type="text/babel">
const { useState, useEffect } = React;
const { Sidebar, TopBar, Overview, Wallets, Transfers, Policies, Settings, CreateWalletDialog } = window;
const { Badge } = window.DFNSDesignSystem_86e15f;

const IMPLEMENTED_VIEWS = ['Dashboard', 'Wallets', 'Transfers', 'Policies', 'Approvals', 'Settings'];

function DashboardApp() {
  const [view, setView] = useState('Dashboard');
  const [dialog, setDialog] = useState(false);
  const [approved, setApproved] = useState([]);
  const [toast, setToast] = useState(null);
  const [loading, setLoading] = useState(false);

  useEffect(() => {
    if (view !== 'Transfers') return;
    setLoading(true);
    const t = setTimeout(() => setLoading(false), 700);
    return () => clearTimeout(t);
  }, [view]);

  const notify = msg => { setToast(msg); setTimeout(() => setToast(null), 2200); };

  return (
    <div style={{ display: 'flex', minHeight: '100vh', background: 'var(--colors-background-base)' }}>
      <Sidebar active={view} onNavigate={setView} />
      <div style={{ flex: 1, minWidth: 0, display: 'flex', flexDirection: 'column' }}>
        <TopBar onSearch={() => {}} />
        <main style={{ flex: 1, padding: 'var(--space-800)', display: 'flex', flexDirection: 'column', gap: 'var(--space-600)' }}>
          {view === 'Dashboard' && <Overview onNavigate={setView} />}
          {view === 'Wallets' && <Wallets onCreate={() => setDialog(true)} />}
          {view === 'Transfers' && <Transfers loading={loading} />}
          {(view === 'Policies' || view === 'Approvals') && <Policies approved={approved} onApprove={w => { setApproved(a => [...a, w]); notify('Approval Recorded'); }} />}
          {view === 'Settings' && <Settings />}
          {!IMPLEMENTED_VIEWS.includes(view) && (
            <div style={{ padding: 'var(--space-800)', borderRadius: 'var(--radius-xl)', background: 'var(--colors-steel-grey-white)', boxShadow: 'var(--ring-card), var(--shadow-base)', display: 'flex', flexDirection: 'column', gap: 'var(--space-300)' }}>
              <span style={{ font: 'var(--weight-bold) var(--text-m)/1 var(--font-core)', letterSpacing: 'var(--tracking-tight)', color: 'var(--colors-dark-purple-900)' }}>{view}</span>
              <span style={{ font: 'var(--weight-base) var(--text-base)/var(--line-m) var(--font-core)', color: 'var(--colors-cold-grey-600)' }}>No data yet. This view is not designed in the source Figma file, so it is left blank rather than invented.</span>
            </div>
          )}
        </main>
      </div>
      <CreateWalletDialog open={dialog} onClose={() => setDialog(false)} onCreate={name => notify('Wallet Created — ' + name)} />
      {toast && (
        <div style={{ position: 'fixed', right: 'var(--space-800)', bottom: 'var(--space-800)', padding: 'var(--space-300) var(--space-400)', borderRadius: 'var(--radius-xl)', background: 'var(--colors-cold-grey-900)', boxShadow: 'var(--shadow-large)', display: 'flex', alignItems: 'center', gap: 'var(--space-250)' }}>
          <Badge color="green">Done</Badge>
          <span style={{ font: 'var(--weight-base) var(--text-base)/1 var(--font-core)', color: 'var(--colors-cold-grey-100)' }}>{toast}</span>
        </div>
      )}
    </div>
  );
}
Object.assign(window, { DashboardApp });

if (!window.__dfnsRoot) window.__dfnsRoot = ReactDOM.createRoot(document.getElementById('root'));
window.__dfnsRoot.render(<DashboardApp />);
</script>
